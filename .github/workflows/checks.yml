name: checks
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v10
      - run: pip install pre-commit && pre-commit run --all-files --show-diff-on-failure
      - name: tests
        run: ./scripts/check.sh
      - name: household denylist
        env: { DENYLIST: "${{ secrets.HOUSEHOLD_DENYLIST }}" }
        run: |
          [ -n "$DENYLIST" ] || exit 0
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/deny.txt"
          if git grep -lIiFf "$RUNNER_TEMP/deny.txt"; then
            echo "::error::household identifier found in the files listed above"; exit 1
          fi
