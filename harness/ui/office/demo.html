        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;

  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);

      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);

      continue;
    }

    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));

      refine(mid, b, depth + 1);

}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);

      const [s, r] = meridian[rim];

        const inset = along(s, Math.max(0, r - bevel), arc);

  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;

    fillPath = surface.fill;
    outline = surface.outline;

    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];

    }

    outline = "";

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));

  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);

}

function stadium(r0, r1, offset, steps = 32) {

  return hullOf([...circle(0, r0), ...circle(offset, r1)]);

function sphereOf(centre, r, P, { steps = 48 } = {}) {

    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>

    [

function solidOf(profile, F, P, options = {}) {

  const last = profile[profile.length - 1];

function bandOfProfile(profile, F, P, options = {}) {

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);

    const points = [];
    for (let step = 0; step <= samples; step++) {

    if (opts.empty) label = "Desk 1: no sessions on this host";
    const dimClass = dim ? " of-dim" : "";
    const inner = `<g class="of-desk${dimClass}" data-slot="${slot}">${all}</g>`;
    return d ? target("session", d.session, label, inner, outline, ` data-slot="${slot}"`) : `<g class="of-free">${inner}</g>`;
  }

  // The side desk is a separate pile, drawn after the parent's loose items: they never overlap on screen.
  function mergeByDepth(firstSvg, items, sideSvg, sideD, f) {
    const sorted = items.sort((a, b) => a.key - b.key).map((i) => i.svg).join("");
    return firstSvg + sorted + sideSvg;
  }
  function boxHitFor(f, span) {
    const c = [];
    for (const u of [0, span]) for (const v of [10, 50]) for (const z of [0, 76]) c.push(f.pt(u, v, z));
    return hit(c);
  }

  // ---- the room -------------------------------------------------------------------------
  function room() {
    const out = [];
    out.push(slab({ x: 0, y: 0, w: W, d: D, r: 0 }, -4, 4, { tone: "lo", crease: "none" }, 2));
    const lines = [];
    for (let v = 47; v < W; v += 47) lines.push(k.lineOnTop([v, 0], [v, D], 0, P), k.lineOnTop([0, v], [W, v], 0, P));
    out.push(L(lines.join(""), { tone: "faint" }));
    out.push(slab({ x: -6, y: -6, w: W + 6, d: 6, r: 0 }, -4, WALL + 4, { tone: "lo", crease: "none" }, 2));
    out.push(slab({ x: -6, y: 0, w: 6, d: D, r: 0 }, -4, WALL + 4, { tone: "lo", crease: "none" }, 2));
    const ribs = [];
    for (let v = 47; v < W; v += 47) ribs.push(seg([v, 0, 60], [v, 0, WALL]), seg([0, v, 60], [0, v, WALL]));
    ribs.push(seg([0, 0, 60], [W, 0, 60]), seg([0, 0, 60], [0, D, 60]), seg([0, 0, 0], [0, 0, WALL]));
    out.push(L(ribs.join(""), { tone: "faint" }));
    out.push(slab({ x: 0, y: 0, w: W, d: 2.4, r: 0 }, 0, 7, { tone: "lo" }, 2));
    out.push(slab({ x: 0, y: 2.4, w: 2.4, d: D - 2.4, r: 0 }, 0, 7, { tone: "lo" }, 2));
    const rug = { x: 124, y: 96, w: 320, d: 330, r: 8 };
    out.push(slab(rug, 0, 0.8, { tone: "lo", crease: "none" }, 4));
    out.push(L(k.planOutline(k.insetPlan(rug, 6), 0.8, P, 4), { tone: "faint" }));
    out.push(L(k.planOutline(k.insetPlan(rug, 11), 0.8, P, 4), { tone: "faint", dotted: true }));
    return out.join("");
  }

  const sign = (host) => {
    const m = k.sideMatrix([0, 330], 138, P, "right");
    return `<text class="iso-face-text of-sign" data-tone="mid" transform="${m}" x="0" y="0" font-size="11">HOST</text><text class="iso-face-text of-sign" data-tone="hi" transform="${m}" x="0" y="14" font-size="13">${esc(host)}</text>${L(seg([0, 330, 110], [0, 262, 110]), { tone: "faint" })}`;
  };

  // ---- hub and ducts --------------------------------------------------------------------
  function hub(active) {
    const out = [slab(HUB, 0, 92, { tone: "hi" }, 3, 0.4)];
    out.push(slab({ x: 8, y: 8, w: 36, d: 36, r: 2 }, 92, 3, { tone: "mid" }, 2));
    const lamps = [];
    for (let i = 0; i < 5; i++) lamps.push(iso([10 + i * 7, 48.1, 80]), iso([48.1, 10 + i * 7, 80]));
    out.push(k.dotsSvg(lamps, { size: 0.9, tone: active ? "hi" : "faint" }));
    out.push(L(rect3(10, 42, 62, 72, 48.1), { tone: "mid" }));
    out.push(k.faceTextSvg(k.sideMatrix([11, 48.1], 70, P, "left"), "WAKER", { size: 3, tone: "hi" }));
    return out.join("");
  }
  function ducts() {
    const a = T.tubePieces([ductStart(0), [W - 4, 4.4, 84]], 4, P, { maxLength: 60 });
    const b = T.tubePieces([ductStart(4), [4.4, D - 4, 84]], 4, P, { maxLength: 60 });
    return [...a, ...b].sort((p, q) => dep(p.mid) - dep(q.mid)).map((p) => T.tubeSvg(p, { tone: "hi" })).join("");
  }

  // ---- wall instruments (plane y = 0) -------------------------------------------------
  const DIAL_Y = 3.2;
  const dialAt = (cx, cz, r, deg, y = DIAL_Y) => [cx + r * Math.sin((deg * Math.PI) / 180), y, cz + r * Math.cos((deg * Math.PI) / 180)];
  function disc(cx, cz, r, h, style) {
    const F = G.frameOf([cx, 0.2, cz], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
    return S(G.disc(0, h, r, F, P), style);
  }

  const GAUGE = { cx: 250, cz: 134, r: 27 };
  const needle = (deg) => L(poly([dialAt(GAUGE.cx, GAUGE.cz, 0.5, deg), dialAt(GAUGE.cx, GAUGE.cz, GAUGE.r - 5, deg)]), { tone: "hi" });
  function gauge(g) {
    const { cx, cz, r } = GAUGE;
    const out = [disc(cx, cz, r, 3, { tone: "hi" })];
    out.push(L(G.circleOf(G.frameOf([cx, 0.2, cz], [0, 1, 0], [1, 0, 0], [0, 0, 1]), 3, r - 3, P), { tone: "mid" }));
    const minor = [];
    const major = [];
    for (let i = 0; i <= 18; i++) {
      const deg = -135 + (270 * i) / 18;
      (i % 3 === 0 ? major : minor).push(poly([dialAt(cx, cz, r - (i % 3 === 0 ? 8.4 : 6.2), deg), dialAt(cx, cz, r - 4, deg)]));
    }
    out.push(L(minor.join(""), { tone: "lo" }), L(major.join(""), { tone: "mid" }));
    out.push(L(poly([dialAt(cx, cz, r - 9.5, g.baseline), dialAt(cx, cz, r - 3.4, g.baseline)]), { tone: "blue" }));
    out.push(`<g data-part="needle">${needle(g.angle)}</g>`);
    out.push(S(G.disc(3, 5, 2.6, G.frameOf([cx, 0.2, cz], [0, 1, 0], [1, 0, 0], [0, 0, 1]), P), { tone: "hi" }));
    out.push(k.faceTextSvg(k.sideMatrix([cx - 11, DIAL_Y], cz - 12, P, "left"), "STEERING", { size: 3.1, tone: "mid" }));
    const pct = g.share === null ? "--" : `${Math.round(g.share * 100)}%`;
    out.push(k.faceTextSvg(k.sideMatrix([cx - 8, DIAL_Y], cz - 17, P, "left"), pct, { size: 5, tone: "hi" }));
    const hitSvg = hit([[cx - r, 0, cz - r], [cx + r, 0, cz - r], [cx + r, 6, cz + r], [cx - r, 6, cz + r]]);
    return target("steering", "", g.label, out.join(""), hitSvg);
  }

  const CLOCK = { cx: 130, cz: 134, r: 24 };
  function clock(c, nowMs) {
    const { cx, cz, r } = CLOCK;
    const F = G.frameOf([cx, 0.2, cz], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
    const out = [disc(cx, cz, r, 3, { tone: "hi" }), L(G.circleOf(F, 3, r - 2.6, P), { tone: "mid" })];
    const ticks = [];
    for (let i = 0; i < 12; i++) ticks.push(poly([dialAt(cx, cz, r - (i % 3 === 0 ? 7 : 5.2), i * 30), dialAt(cx, cz, r - 3.6, i * 30)]));
    out.push(L(ticks.join(""), { tone: "mid" }));
    const d = new Date(nowMs);
    const mins = d.getMinutes() + d.getSeconds() / 60;
    const hr = ((d.getHours() % 12) + mins / 60) * 30;
    out.push(L(poly([dialAt(cx, cz, 0.5, mins * 6), dialAt(cx, cz, r - 5.5, mins * 6)]), { tone: "hi" }));
    out.push(L(poly([dialAt(cx, cz, 0.5, hr), dialAt(cx, cz, r - 10, hr)]), { tone: "hi" }));
    if (c.jobAngle !== null) out.push(L(poly([dialAt(cx, cz, r - 1.8, c.jobAngle), dialAt(cx, cz, r + 0.2, c.jobAngle)]), { tone: "blue" }), `<circle class="of-job" cx="${iso(dialAt(cx, cz, r + 3.4, c.jobAngle))[0].toFixed(1)}" cy="${iso(dialAt(cx, cz, r + 3.4, c.jobAngle))[1].toFixed(1)}" r="1.5"/>`);
    out.push(S(G.disc(3, 4.6, 2, F, P), { tone: "hi" }));
    out.push(k.faceTextSvg(k.sideMatrix([cx - 9, DIAL_Y], cz - 12, P, "left"), c.nextJob ? clip(`next ${c.nextJob}`, 14) : "no job", { size: 2.8, tone: "mid" }));
    const hitSvg = hit([[cx - r, 0, cz - r], [cx + r, 0, cz - r], [cx + r, 6, cz + r], [cx - r, 6, cz + r]]);
    return target("jobs", "", c.label, out.join(""), hitSvg);
  }

  const FUSE = { x: 318, w: 112, z0: 104, z1: 168 };
  const MODE_Z = { enforce: 8.6, inject: 5.8, advise: 3, off: 0.2 };
  function fuses(f) {
    const out = [slab({ x: FUSE.x, y: 0.2, w: FUSE.w, d: 6, r: 1.5 }, FUSE.z0, FUSE.z1 - FUSE.z0, { tone: "hi" }, 3, 0.4)];
    out.push(L(k.planOutline({ x: FUSE.x + 3, y: 6.2, w: FUSE.w - 6, d: 0.01, r: 0 }, FUSE.z1, P, 2), { tone: "faint" }));
    out.push(L(rect3(FUSE.x + 4, FUSE.x + FUSE.w - 4, FUSE.z0 + 4, FUSE.z1 - 4, 6.3), { tone: "mid" }));
    // main lever
    out.push(L(rect3(FUSE.x + 8, FUSE.x + 16, FUSE.z0 + 10, FUSE.z1 - 10, 6.3), { tone: "mid" }));
    out.push(slab({ x: FUSE.x + 7, y: 6.3, w: 10, d: 3.2, r: 0.8 }, f.main ? FUSE.z1 - 28 : FUSE.z0 + 12, 12, { tone: f.main ? "hi" : "red" }, 2));
    out.push(k.faceTextSvg(k.sideMatrix([FUSE.x + 6, 6.3], FUSE.z1 - 6, P, "left"), f.main ? "MAIN ON" : "MAIN OFF", { size: 2.6, tone: f.main ? "mid" : "red" }));
    f.breakers.forEach((b, i) => {
      const col = i % 6;
      const row = Math.floor(i / 6);
      const bx = FUSE.x + 26 + col * 14;
      const bz = FUSE.z1 - 20 - row * 28;
      out.push(L(rect3(bx - 1, bx + 7, bz - 1, bz + 15, 6.3), { tone: "faint" }));
      out.push(slab({ x: bx, y: 6.3, w: 6, d: 2.6, r: 0.6 }, bz + MODE_Z[b.mode] - 0.2, 4.4, { tone: b.mode === "off" ? "lo" : "hi" }, 2));
    });
    const hitSvg = boxHit({ x: FUSE.x, y: 0, w: FUSE.w, d: 10 }, FUSE.z0, FUSE.z1);
    return target("rules", "", f.label, out.join(""), hitSvg);
  }

  // ---- cabinet --------------------------------------------------------------------------
  const CAB = { x: 150, y: 168, w: 64, d: 46, r: 2 };
  const CAB_FRONT = CAB.y + CAB.d;
  const DRAWER_Z = (slot) => 8 + (7 - slot) * 10.2;
  function cabinet(drawers, offs, overflow) {
    const out = [slab(k.insetPlan(CAB, 2), 0, 4, { tone: "hi" }, 2), slab(CAB, 4, 86, { tone: "hi" }, 3, 0.4), slab(k.insetPlan(CAB, -1.4), 90, 4, { tone: "hi" }, 3, 0.4)];
    if (overflow > 0) out.push(k.faceTextSvg(k.topMatrix([CAB.x + 4, CAB.y + 10], 94, P), `+${overflow}`, { size: 9, tone: "hi" }));
    for (let slot = 7; slot >= 0; slot--) {
      const dr = drawers[slot];
      const z0 = DRAWER_Z(slot);
      const off = offs[slot] || 0;
      const yf = CAB_FRONT + off;
      let svg = "";
      if (off > 0.4) {
        const box = { x: CAB.x + 4, y: CAB_FRONT + 1.2, w: 56, d: off, r: 0.6 };
        svg += slab(box, z0 + 0.6, 6.4, { tone: "mid" }, 2);
        const folders = [];
        for (let i = 0; i < 6; i++) folders.push(k.lineOnTop([box.x + 6 + i * 8.6, box.y + 1.2], [box.x + 6 + i * 8.6, box.y + Math.max(1.4, off - 1.4)], z0 + 7, P));
        svg += L(folders.join(""), { tone: "lo" });
      }
      const fplan = { x: CAB.x + 4, y: yf, w: 56, d: 2.4, r: 0.8 };
      const lit = !!dr?.lit;
      svg += slab(fplan, z0, 9, { tone: dr ? "hi" : "lo", lit }, 2, 0.2);
      if (dr) {
        const yy = yf + 2.5;
        svg += L(seg([CAB.x + 26, yy, z0 + 3.2], [CAB.x + 38, yy, z0 + 3.2]), { tone: "mid" });
        svg += k.faceTextSvg(k.sideMatrix([CAB.x + 7, yy], z0 + 7.6, P, "left"), clip(dr.branch, 9), { size: 2.4, tone: "hi" });
        if (dr.conflict) svg += slab({ x: CAB.x + 46, y: yf, w: 10, d: 1.4, r: 0.3 }, z0 + 9, 3.2, { tone: "red" }, 2);
        if (dr.behind) svg += L(seg([CAB.x + 8, yy, z0 + 1.2], [CAB.x + 56, yy, z0 + 1.2]), { tone: "blue", dashed: true });
        const hp = [[CAB.x + 4, yf, z0], [CAB.x + 60, yf, z0], [CAB.x + 60, yf + 3, z0 + 9], [CAB.x + 4, yf + 3, z0 + 9]];
        if (off > 0.4) hp.push([CAB.x + 4, CAB_FRONT, z0], [CAB.x + 60, CAB_FRONT, z0]);
        out.push(target("worktree", dr.id, dr.label, svg, hit(hp.map((p) => [p[0] - 1, p[1] + 0.5, p[2] - 0.8]))));
      } else {
        svg += L(seg([CAB.x + 26, yf + 2.5, z0 + 3.2], [CAB.x + 38, yf + 2.5, z0 + 3.2]), { tone: "faint" });
        out.push(svg);
      }
    }
    return out.join("");
  }

  // ---- ticker ---------------------------------------------------------------------------
  const TK = { x: 326, y: 196, w: 56, d: 32, r: 2 };
  const TAPE_Y = 221;
  function tape(tk, phase) {
    const pitch = 5;
    const shift = (((phase % pitch) + pitch) % pitch);
    const ticks = [];
    const reds = [];
    const lane = (x0, x1, z, from) => {
      for (let x = x0 + shift; x < x1 - 1; x += pitch) {
        const idx = Math.round((x - from) / pitch);
        const isDeny = tk.denyMarks > 0 && idx % Math.max(3, 13 - tk.denyMarks) === 0 && idx > 0;
        (isDeny ? reds : ticks).push(k.lineOnTop([x, TAPE_Y + (isDeny ? 0.8 : 2)], [x, TAPE_Y + (isDeny ? 6.2 : 5)], z, P));
      }
    };
    lane(328, 383, 29.8, 328);
    lane(386.4, 440, 0.6, 386.4);
    return L(ticks.join(""), { tone: "hi" }) + L(reds.join(""), { tone: "red" });
  }
  function ticker(tk, phase) {
    const out = [slab(TK, 0, 26, { tone: "hi" }, 3, 0.4), slab(k.insetPlan(TK, -2.5), 26, 3, { tone: "hi" }, 3, 0.3)];
    out.push(cyl(338, 210, 8.6, 29, 6, { tone: "hi" }, 22), cyl(370, 210, 8.6, 29, 6, { tone: "hi" }, 22));
    out.push(L(k.ring(338, 210, 5.2, 35, P, 20) + k.ring(370, 210, 5.2, 35, P, 20), { tone: "mid" }));
    out.push(slab({ x: 328, y: TAPE_Y, w: 56, d: 7, r: 0 }, 29, 0.8, { tone: "mid" }, 2));
    out.push(slab({ x: 384, y: TAPE_Y, w: 1.4, d: 7, r: 0 }, 0, 29.8, { tone: "mid" }, 2));
    out.push(slab({ x: 385.4, y: TAPE_Y, w: 56, d: 7, r: 0 }, 0, 0.6, { tone: "mid" }, 2));
    out.push(`<g data-part="tape">${tape(tk, phase)}</g>`);
    out.push(L(seg([328, TAPE_Y, 29.8], [328, TAPE_Y + 7, 29.8]), { tone: "faint" }));
    out.push(k.faceTextSvg(k.sideMatrix([TK.x + 5, TK.y + TK.d], 19, P, "left"), "TICKER", { size: 4, tone: "hi" }));
    out.push(k.faceTextSvg(k.sideMatrix([TK.x + 5, TK.y + TK.d], 12, P, "left"), `${Math.round(tk.rate)}/min`, { size: 3, tone: "mid" }));
    const lamps = [iso([TK.x + 40, TK.y + TK.d, 17]), iso([TK.x + 46, TK.y + TK.d, 17]), iso([TK.x + 52, TK.y + TK.d, 17])];
    out.push(k.dotsSvg(lamps, { size: 1, tone: tk.speed > 0.02 ? "hi" : "faint" }));
    const hitSvg = boxHit({ x: TK.x - 2, y: TK.y - 2, w: TK.w + 4, d: TK.d + 4 }, 0, 36);
    return target("journal", "", tk.label, out.join(""), hitSvg);
  }

  // ---- stamp ----------------------------------------------------------------------------
  const ST = { x: 232, y: 252, w: 60, d: 36, r: 2 };
  const stampHead = (lift) => {
    const z = 24 + lift;
    return slab({ x: ST.x + 11, y: ST.y + 20, w: 10, d: 6, r: 1 }, z, 4, { tone: "hi" }, 2) + cyl(ST.x + 16, ST.y + 23, 2.2, z + 4, 9, { tone: "hi" }, 14) + cyl(ST.x + 16, ST.y + 23, 3.6, z + 13, 3, { tone: "hi" }, 16);
  };
  function stamp(sp, lift) {
    const out = [slab({ x: ST.x + 3, y: ST.y + 2, w: 4, d: ST.d - 4, r: 0.5 }, 0, 18, { tone: "mid" }, 2), slab({ x: ST.x + ST.w - 7, y: ST.y + 2, w: 4, d: ST.d - 4, r: 0.5 }, 0, 18, { tone: "mid" }, 2)];
    out.push(slab(ST, 18, 4, { tone: "mid" }, 3, 0.3));
    out.push(slab({ x: ST.x + 34, y: ST.y + 5, w: 20, d: 26, r: 0 }, 22, 0.7, { tone: "mid" }, 2));
    out.push(L(k.lineOnTop([ST.x + 37, ST.y + 24], [ST.x + 51, ST.y + 24], 22.7, P) + k.lineOnTop([ST.x + 37, ST.y + 27], [ST.x + 48, ST.y + 27], 22.7, P), { tone: "faint" }));
    if (sp.pressed) out.push(L(k.ring(ST.x + 44, ST.y + 14, 4.4, 22.7, P, 16) + k.lineOnTop([ST.x + 41.6, ST.y + 14], [ST.x + 43.4, ST.y + 15.8], 22.7, P) + k.lineOnTop([ST.x + 43.4, ST.y + 15.8], [ST.x + 47, ST.y + 11.6], 22.7, P), { tone: "green" }));
    out.push(slab({ x: ST.x + 6, y: ST.y + 16, w: 20, d: 14, r: 1.5 }, 22, 2, { tone: "hi" }, 3));
    out.push(L(k.planOutline({ x: ST.x + 9, y: ST.y + 19, w: 14, d: 8, r: 1 }, 24, P, 2), { tone: "faint" }));
    out.push(`<g data-part="stamp-head">${stampHead(lift)}</g>`);
    out.push(k.faceTextSvg(k.sideMatrix([ST.x + 5, ST.y + ST.d], 20.4, P, "left"), `GRANTS ${sp.issued} · ${sp.pending} open`, { size: 2.7, tone: "mid" }));
    const hitSvg = boxHit(ST, 0, 40);
    return target("grants", "", sp.label, out.join(""), hitSvg);
  }

  // ---- bell -----------------------------------------------------------------------------
  const BELL = [150, 318];
  const bellSwing = (a) => {
    const F = G.frameOf([BELL[0], BELL[1], 40], [Math.sin(a), 0, -Math.cos(a)], [Math.cos(a), 0, Math.sin(a)], [0, 1, 0]);
    return S(G.solidOf([[0, 1.2], [2.4, 6, 1], [7.4, 9.4, 1], [10.4, 10.8]], F, P), { tone: "hi" }) + S(G.sphereOf([BELL[0] + Math.sin(a) * 12, BELL[1], 40 - Math.cos(a) * 12], 2, P), { tone: "hi" });
  };
  function bell(on, swing) {
    const out = [cyl(BELL[0], BELL[1], 9, 0, 2, { tone: "hi" }, 22), cyl(BELL[0], BELL[1], 1.7, 2, 24, { tone: "hi" }, 12)];
    out.push(`<g data-part="bell-swing">${bellSwing(swing)}</g>`);
    if (on) {
      const arcs = [];
      for (const r of [15, 19]) arcs.push(poly([[BELL[0] - r, BELL[1], 44], [BELL[0] - r - 2, BELL[1], 47]]), poly([[BELL[0] + r, BELL[1], 44], [BELL[0] + r + 2, BELL[1], 47]]));
      out.push(L(arcs.join(""), { tone: "hi" }));
    }
    const label = on ? "Bell: ringing" : "Bell: quiet";
    return target("inbox", "", label, out.join(""), boxHit({ x: BELL[0] - 11, y: BELL[1] - 11, w: 22, d: 22 }, 0, 52));
  }

  // ---- rack -----------------------------------------------------------------------------
  const RK = { x: 372, y: 392, w: 76, d: 24, r: 1.5 };
  function rack(rk) {
    const out = [slab(RK, 0, 66, { tone: "hi" }, 3, 0.4), slab(k.insetPlan(RK, -1.6), 66, 3, { tone: "hi" }, 2)];
    const yf = RK.y + RK.d;
    for (let i = 0; i < 12; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = RK.x + 4 + col * 35;
      const z = 6 + row * 9;
      const slot = rk.slots[i];
      if (!slot) {
        out.push(L(rect3(x, x + 31, z, z + 7, yf), { tone: "faint" }));
        continue;
      }
      const blade = slab({ x, y: yf, w: 31, d: 2.6, r: 0.5 }, z, 7, { tone: "hi" }, 2);
      const led = L(seg([x + 3, yf + 2.7, z + 3.5], [x + 6, yf + 2.7, z + 3.5]), { tone: slot.lit ? "green" : "lo" });
      out.push(target("session", slot.session, slot.label, blade + led, hit([[x - 1, yf, z - 1], [x + 32, yf, z - 1], [x + 32, yf + 3, z + 8], [x - 1, yf + 3, z + 8]])));
    }
    out.push(k.faceTextSvg(k.sideMatrix([RK.x + 6, yf], 76, P, "left"), rk.total > 0 ? `RACK +${rk.total}` : "RACK", { size: 6, tone: rk.total > 0 ? "hi" : "lo" }));
    return out.join("");
  }

  /** Draw order: the room first, then everything by depth. Wall instruments sit on the wall, before any desk. */
  const ITEMS = () => {
    const key = (x, y, z) => dep([x, y, z]);
    const list = [
      { id: "room", key: -1e9 },
      { id: "wall", key: -9e8 },
      { id: "hub", key: -8e8 },
      { id: "ducts", key: -7e8 },
      { id: "capsBack", key: -6.9e8 },
      { id: "gauge", key: -6e8 },
