name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: |
          docker build -t 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:latest .
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:latest
      - run: aws ecs update-service --cluster staging --service app --force-new-deployment
  production:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: |
          docker build -t 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:latest .
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:latest
      - run: aws ecs update-service --cluster prod --service app --force-new-deployment
