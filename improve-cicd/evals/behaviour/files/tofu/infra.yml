name: infra
on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
jobs:
  tofu:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: arn:aws:iam::123456789012:role/gha-infra, aws-region: us-east-1 }
      - uses: actions/cache@v4
        with:
          path: infra/.terraform
          key: tf-${{ hashFiles('infra/**') }}
      - run: tofu init
      - run: tofu plan -refresh=false
        if: github.event_name == 'pull_request'
      - run: tofu apply -auto-approve -refresh=false
        if: github.event_name == 'push'
